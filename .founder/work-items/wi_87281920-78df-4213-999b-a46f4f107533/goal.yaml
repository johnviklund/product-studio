notes: Use one shared origin-plus-capped-JSON route factory across exactly the
  13 pre-existing unguarded mutating routes named in TODO.md. Preserve existing
  request schemas and controller semantics. Do not add a Content-Type gate.
  Verify wrong or missing Origin, oversize or malformed JSON, unknown keys, and
  valid same-origin behavior. Keep this work within the accepted TODO boundary.
goal_contract:
  schema_version: 1
  goal_version: 2
  purpose: Protect exactly the 13 pre-existing unguarded mutating API routes
    within the accepted TODO boundary by adopting one shared route factory that
    fails closed for untrusted origins and caps JSON request bodies, while
    preserving each route's existing request schema and controller semantics.
  acceptance_criteria:
    - "A single shared route factory applies assertTrustedRequestOrigin and
      readCappedJsonRequest across exactly the 13 named pre-existing routes:
      [workItemId] PATCH, [workItemId]/edit PATCH, mission/{route,retry,import},
      mission/patch{,/import}, mission/review{,/import}, patch-plan,
      portfolio/work-items POST, work-items/rebuild POST, and workspaces POST."
    - Each of the 13 routes rejects requests with a missing or wrong Origin
      before its mutating behavior runs, while valid same-origin requests retain
      their current success behavior and controller semantics.
    - JSON-consuming routes reject oversized bodies, malformed JSON, and unknown
      request keys using the shared capped parser and their existing schemas;
      work-items/rebuild retains its bodyless behavior while receiving the
      origin guard.
    - The shared factory does not require a JSON Content-Type header, preserving
      the current intentional request-parsing behavior while Origin validation
      remains fail-closed.
  non_goals:
    - Guarding mutating API routes outside the 13 pre-existing routes named in
      TODO.md.
    - Changing existing route request schemas, controller semantics, or
      closed-transition policy.
    - Adding a Content-Type gate or relaxing missing-Origin rejection for
      non-browser clients.
  allowed_scope:
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/edit/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/import/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/patch/import/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/patch/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/retry/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/review/import/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/review/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/mission/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/patch-plan/route.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/route-factory.ts
    - app/api/portfolio/work-items/[sourceId]/[workItemId]/route.ts
    - app/api/portfolio/work-items/route.ts
    - app/api/request-body.ts
    - app/api/work-items/rebuild/route.ts
    - app/api/workspaces/route.ts
    - tests/api/portfolio-routes.test.ts
  review_ready:
    - The 13-route inventory is confirmed against TODO.md, with no additional
      mutating route adoption.
    - Focused route tests demonstrate rejection for missing or wrong Origin,
      oversized or malformed JSON, and unknown keys, plus unchanged valid
      same-origin behavior.
    - The implementation is inspected to confirm every JSON-consuming route uses
      the common factory/parser and no Content-Type gate was introduced.
